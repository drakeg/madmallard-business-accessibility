services:
  workbench:
    build: .
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-8086}:8080'
    environment:
      API_TOKEN: ${API_TOKEN:?Set a random token of at least 32 characters}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DB_PATH: /app/data/audits.sqlite
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOCAL_TESTING: ${LOCAL_TESTING:-false}
    volumes:
      - audits:/app/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1
    init: true
    restart: unless-stopped
volumes:
  audits:
