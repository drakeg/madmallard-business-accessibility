name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Node and browser regression tests
        run: npm test
      - name: Packaged Vercel Chromium integration on Linux
        run: node --test test/serverless-chromium.test.js
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation and badge consistency
        run: |
          python3 scripts/repository-audit.py --repo . --check
          python3 scripts/badges.py --repo . --mode check
          python3 -m unittest discover -s tests -p 'test_badges.py'
