name: Hosted smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 1-5'
permissions:
  contents: read
jobs:
  public-readonly-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify hosted health, database access, and authorization boundary
        run: node scripts/smoke-hosted.mjs
