name: Dependency security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '20 9 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
